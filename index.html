<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style type="text/tailwindcss">
@layer components{
.btn{@apply px-3 py-1.5 rounded-lg text-sm font-semibold bg-emerald-800 text-white hover:bg-emerald-900 disabled:opacity-50}
.btn2{@apply px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-700 border border-slate-300 hover:bg-slate-100}
.btnr{@apply px-2 py-1 rounded text-xs font-medium bg-red-50 text-red-700 border border-red-200 hover:bg-red-100}
.btng{@apply px-2 py-1 rounded text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100}
.inp{@apply w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white}
.card{@apply bg-white rounded-xl border border-slate-200 p-4}
.lbl{@apply block text-xs font-semibold text-slate-600 mb-1}
.th{@apply px-3 py-2 text-left text-xs font-semibold text-slate-600 bg-slate-100}
.td{@apply px-3 py-2 align-top}
.tag{@apply px-2 py-0.5 rounded text-xs font-semibold inline-block}
}</style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div id="mbody" class="bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5"></div></div>

<!-- SIGN IN / SIGN UP -->
<div id="auth" class="hidden min-h-screen flex items-center justify-center p-4">
  <form onsubmit="authSubmit(event)" class="card w-full max-w-sm space-y-3">
    <h1 class="font-bold text-xl text-emerald-900">Diamond Portal</h1>
    <p class="text-sm text-slate-500">Members only. Sign in to see available diamonds.</p>
    <div id="a-namebox" class="hidden"><label class="lbl">Your name</label><input id="a-name" class="inp"></div>
    <div><label class="lbl">Email</label><input id="a-email" type="email" required class="inp"></div>
    <div><label class="lbl">Password</label><input id="a-pw" type="password" required minlength="6" class="inp"></div>
    <button id="a-btn" class="btn w-full">Sign in</button>
    <div class="flex justify-between text-xs">
      <button type="button" class="text-emerald-800 underline" onclick="forgot()">Forgot password?</button>
      <button type="button" id="a-toggle" class="text-emerald-800 underline" onclick="authMode()">Create an account</button>
    </div>
  </form>
</div>

<!-- TEAM JOIN (new users before approval) -->
<div id="onboard" class="hidden max-w-lg mx-auto p-4 pt-10"></div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-emerald-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div><div class="font-bold text-lg leading-tight">Diamond Portal</div><div id="who" class="text-xs text-emerald-200"></div></div>
      <div id="hdr" class="flex flex-wrap items-center gap-2"></div>
    </div>
  </header>
  <div class="bg-white border-b border-slate-200"><nav id="tabs" class="max-w-6xl mx-auto px-4 flex overflow-x-auto"></nav></div>
  <div id="banner"></div>
  <main id="view" class="max-w-6xl mx-auto px-4 py-5"></main>
</div>

<script>
const db = window.supabase.createClient('https://srxptffjytjzyobafmkv.supabase.co','sb_publishable_6d3TQR4H_CwT9j1Wg9cMUA_kSkcKYxf');
const S = {user:null,profile:null,mem:[],myTeams:[],team:null,teams:[],set:{},slots:[],mine:[],all:[],tab:'open',f:{date:'',park:'',tier:''},cal:false,cm:new Date(),pend:0,sf:{status:'',park:'',from:''}};
const V = {};
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const D = s => { const [y,m,d] = s.split('-'); return new Date(y,m-1,d).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'}); };
const T = s => { let [h,m] = s.split(':'); h = +h; return `${h%12||12}:${m} ${h>=12?'PM':'AM'}`; };
const isAdmin = () => S.profile?.role === 'admin';
const dl = (txt,name,type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type})); a.download = name; a.click(); };
const modal = h => { $('mbody').innerHTML = h; $('modal').classList.remove('hidden'); };
const closeModal = () => $('modal').classList.add('hidden');
const cost = s => s.has_lights ? +S.set.prem_cost : +S.set.std_cost;
const calc = (s,r) => r === 'Rainout' && S.set.rainout_free === 'true' ? 0 : cost(s);
const tier = s => `<span class="tag ${s.has_lights?'bg-amber-100 text-amber-900':'bg-slate-100 text-slate-600'}">${s.has_lights?'PREM (lit)':'STD'}</span>`;
const stTag = s => `<span class="tag ${s==='Booked'?'bg-blue-100 text-blue-800':s==='Rainout'?'bg-red-100 text-red-800':'bg-emerald-100 text-emerald-800'}">${s}</span>`;
const audit = (a,d) => db.rpc('log_audit',{p_action:a,p_details:d||''});

function toast(m, err) {
  const t = $('toast');
  t.className = `fixed top-3 right-3 z-[60] max-w-sm p-3 rounded-lg border text-sm shadow ${err?'bg-red-50 border-red-300 text-red-800':'bg-emerald-50 border-emerald-300 text-emerald-900'}`;
  t.textContent = m; clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 5000);
}
async function rpc(fn, args) {
  const { data, error } = await db.rpc(fn, args);
  if (error) { toast(error.message, 1); return null; }
  if (data && data.success === false) { toast(data.message, 1); return null; }
  if (data && data.message) toast(data.message);
  return data || {};
}

/* ---------- AUTH ---------- */
let signup = false;
function authMode() {
  signup = !signup;
  $('a-namebox').classList.toggle('hidden', !signup);
  $('a-btn').textContent = signup ? 'Create account' : 'Sign in';
  $('a-toggle').textContent = signup ? 'I already have an account' : 'Create an account';
}
async function authSubmit(e) {
  e.preventDefault();
  const email = $('a-email').value.trim(), password = $('a-pw').value;
  if (signup) {
    const { error } = await db.auth.signUp({ email, password, options: { data: { full_name: $('a-name').value.trim() }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return toast(error.message, 1);
    toast('Account created. Confirm your email, then sign in and choose your team.'); authMode();
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) toast(error.message, 1);
  }
}
async function forgot() {
  const email = $('a-email').value.trim();
  if (!email) return toast('Enter your email first.', 1);
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  error ? toast(error.message, 1) : toast('Password reset email sent.');
}
db.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(async () => {
    const p = prompt('Enter a new password (6+ characters):');
    if (p) { const r = await db.auth.updateUser({ password: p }); toast(r.error ? r.error.message : 'Password updated.', !!r.error); }
  }, 300);
  if (ev === 'SIGNED_IN' && S.user && session && S.user.id === session.user.id) return;
  if (['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)) setTimeout(() => boot(session), 0);
});

/* ---------- BOOT ---------- */
async function boot(session) {
  S.user = session?.user || null;
  ['auth','onboard','app'].forEach(x => $(x).classList.add('hidden'));
  if (!S.user) { S.profile = null; return $('auth').classList.remove('hidden'); }
  const { data: p } = await db.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (!p) { toast('Profile not found. Contact an administrator.', 1); return db.auth.signOut(); }
  S.profile = p;
  await Promise.all([loadMem(), loadSet(), loadTeams()]);
  if (isAdmin()) { await pending(); if (S.tab === 'open') S.tab = 'dash'; }
  else if (!S.team) return showOnboard();
  showApp();
}
async function loadMem() {
  const { data } = await db.from('team_members').select('*,teams(id,name,division,tokens_remaining)').eq('user_id', S.user.id);
  S.mem = data || [];
  S.myTeams = S.mem.filter(m => m.status === 'approved').map(m => m.teams);
  S.team = S.myTeams.find(t => t.id === S.profile.active_team_id) || S.myTeams[0] || null;
}
async function loadSet() { const { data } = await db.from('settings').select('*'); S.set = Object.fromEntries((data || []).map(r => [r.key, r.value])); }
async function loadTeams() { const { data } = await db.from('teams').select('*').order('name'); S.teams = data || []; }
async function pending() {
  const { count } = await db.from('team_members').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  S.pend = count || 0;
}

/* ---------- TEAM JOIN ---------- */
function joinForm() {
  const taken = new Set(S.mem.filter(m => m.status !== 'rejected').map(m => m.team_id));
  const av = S.teams.filter(t => t.active && !taken.has(t.id));
  return av.length ? `<div><label class="lbl">Request to join a team</label><div class="flex gap-2">
    <select id="j-team" class="inp">${av.map(t => `<option value="${t.id}">${esc(t.name)}${t.division?' ('+esc(t.division)+')':''}</option>`).join('')}</select>
    <button class="btn" onclick="reqTeam()">Request</button></div>
    <p class="text-xs text-slate-500 mt-1">An administrator must approve each request. You can belong to more than one team.</p></div>`
    : '<p class="text-sm text-slate-500">No teams available to join. Ask your administrator to create teams.</p>';
}
function memList() {
  if (!S.mem.length) return '';
  return `<div><div class="lbl">Your requests</div>${S.mem.map(m => `<div class="flex justify-between text-sm py-1 border-b border-slate-100"><span>${esc(m.teams?.name)}</span>
    <span class="tag ${m.status==='approved'?'bg-emerald-100 text-emerald-800':m.status==='pending'?'bg-amber-100 text-amber-800':'bg-red-100 text-red-800'}">${m.status}</span></div>`).join('')}</div>`;
}
function showOnboard() {
  const o = $('onboard'); o.classList.remove('hidden');
  o.innerHTML = `<div class="card space-y-4"><div class="flex justify-between items-center"><h1 class="font-bold text-xl text-emerald-900">Choose your team</h1><button class="btn2" onclick="db.auth.signOut()">Sign out</button></div>
    <p class="text-sm text-slate-600">Signed in as ${esc(S.user.email)}. You can see diamonds once an administrator approves your team.</p>${joinForm()}${memList()}</div>`;
}
async function reqTeam() {
  const id = $('j-team')?.value; if (!id) return;
  if (await rpc('request_team', { p_team_id: id })) { await loadMem(); closeModal(); (!isAdmin() && !S.team) ? showOnboard() : (showApp(), joinModal()); }
}
function joinModal() { modal(`<div class="space-y-4"><div class="flex justify-between"><h3 class="font-bold text-lg">Join another team</h3><button class="btn2" onclick="closeModal()">Close</button></div>${joinForm()}${memList()}</div>`); }

/* ---------- APP SHELL ---------- */
const TABS = [['open','Open diamonds'],['mine','My bookings'],['dash','Dashboard',1],['appr','Approvals',1],['sched','Schedule',1],['teams','Teams & credits',1],['imp','CSV import',1],['set','Settings',1],['aud','Audit log',1]];
function showApp() {
  ['auth','onboard'].forEach(x => $(x).classList.add('hidden')); $('app').classList.remove('hidden');
  header(); tabs(); banner(); go(S.tab);
}
function header() {
  $('who').textContent = S.profile.email + (isAdmin() ? ' (administrator)' : '');
  const sel = S.myTeams.length ? `<select class="rounded-lg px-2 py-1 text-sm text-slate-900" onchange="switchTeam(this.value)">${S.myTeams.map(t => `<option value="${t.id}" ${t.id===S.team?.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <span class="tag bg-amber-300 text-slate-900">${S.team?.tokens_remaining ?? 0} credits</span>` : '';
  $('hdr').innerHTML = `${sel}<button class="btn2 !py-1" onclick="joinModal()">Join a team</button><button class="btn2 !py-1" onclick="db.auth.signOut()">Sign out</button>`;
}
function tabs() {
  $('tabs').innerHTML = TABS.filter(t => !t[2] || isAdmin()).map(t =>
    `<button onclick="go('${t[0]}')" class="px-3 py-3 text-sm font-semibold whitespace-nowrap border-b-2 ${S.tab===t[0]?'border-emerald-800 text-emerald-900':'border-transparent text-slate-600'}">${t[1]}${t[0]==='appr'&&S.pend?` <span class="tag bg-amber-400 text-slate-900">${S.pend}</span>`:''}</button>`).join('');
}
function banner() {
  $('banner').innerHTML = S.set.announcement ? `<div class="bg-amber-100 text-amber-900 text-sm text-center py-2 px-4">${esc(S.set.announcement)}</div>` : '';
}
async function go(t) { S.tab = t; tabs(); $('view').innerHTML = '<p class="text-slate-500 p-6">Loading...</p>'; await V[t](); }
async function switchTeam(id) {
  if (await rpc('set_active_team', { p_team_id: id })) { S.profile.active_team_id = id; await loadMem(); header(); go(S.tab); }
}

/* ---------- COACH: OPEN DIAMONDS ---------- */
async function loadSlots() {
  const { data, error } = await db.from('diamonds').select('*').eq('status','Available').gte('date', today()).order('date').order('start_time');
  if (error) return toast(error.message, 1);
  S.slots = data || [];
}
V.open = async () => { await loadSlots(); drawOpen(); };
function drawOpen() {
  const f = S.f, parks = [...new Set(S.slots.map(s => s.park_name))].sort();
  const base = S.slots.filter(s => (!f.park || s.park_name === f.park) && (!f.tier || s.tier_code === f.tier));
  const list = f.date ? base.filter(s => s.date === f.date) : base;
  $('view').innerHTML = `<div class="card grid md:grid-cols-5 gap-3 items-end mb-4">
    <div><label class="lbl">Date</label><input type="date" class="inp" value="${f.date}" min="${today()}" onchange="S.f.date=this.value;S.cal=false;drawOpen()"></div>
    <div><label class="lbl">Park</label><select class="inp" onchange="S.f.park=this.value;drawOpen()"><option value="">All parks</option>${parks.map(p => `<option ${p===f.park?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    <div><label class="lbl">Diamond type</label><select class="inp" onchange="S.f.tier=this.value;drawOpen()"><option value="">All</option><option value="PREM" ${f.tier==='PREM'?'selected':''}>Premium (lit)</option><option value="STD" ${f.tier==='STD'?'selected':''}>Standard (unlit)</option></select></div>
    <button class="btn2" onclick="S.f={date:'',park:'',tier:''};drawOpen()">Clear filters</button>
    <div class="flex gap-1"><button class="${!S.cal?'btn':'btn2'} flex-1" onclick="S.cal=false;drawOpen()">List</button><button class="${S.cal?'btn':'btn2'} flex-1" onclick="S.cal=true;drawOpen()">Calendar</button></div></div>
    ${S.cal ? calHTML(base) : (list.length ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(card).join('')}</div>` : '<div class="card text-center text-slate-500 py-8">No open diamonds match these filters.</div>')}`;
}
function card(s) {
  const c = cost(s);
  return `<div class="card flex flex-col justify-between"><div>
    <div class="flex justify-between items-start"><b class="text-emerald-900">${D(s.date)}</b>${tier(s)}</div>
    <div class="font-bold text-lg mt-1">${esc(s.park_name)}</div>
    <div class="text-sm text-slate-600">Diamond ${esc(s.diamond_number)} &middot; ${esc(s.field_size)} bases</div>
    <div class="text-sm font-semibold mt-2">${T(s.start_time)} - ${T(s.end_time)}</div>
    <a class="text-xs text-emerald-800 underline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.park_name)}">Map</a></div>
    ${S.team ? `<button class="btn w-full mt-3" onclick="bookModal('${s.id}')">Book for ${c} credit${c===1?'':'s'}</button>` : '<p class="text-xs text-amber-700 mt-3">Join a team to book.</p>'}</div>`;
}
function calHTML(L) {
  const y = S.cm.getFullYear(), m = S.cm.getMonth(), first = new Date(y,m,1), n = new Date(y,m+1,0).getDate(), cnt = {};
  L.forEach(s => cnt[s.date] = (cnt[s.date] || 0) + 1);
  let c = ''; for (let i = 0; i < first.getDay(); i++) c += '<div></div>';
  for (let d = 1; d <= n; d++) {
    const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, k2 = cnt[k];
    c += `<button ${k2?`onclick="S.f.date='${k}';S.cal=false;drawOpen()"`:'disabled'} class="border rounded-lg p-1.5 h-16 text-left ${k2?'bg-emerald-50 border-emerald-300 hover:bg-emerald-100':'bg-slate-50 text-slate-400'}"><div class="text-xs">${d}</div>${k2?`<div class="text-sm font-bold text-emerald-800">${k2} open</div>`:''}</button>`;
  }
  return `<div class="card"><div class="flex justify-between items-center mb-3"><button class="btn2" onclick="S.cm=new Date(${y},${m-1},1);drawOpen()">&lt;</button><b>${first.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</b><button class="btn2" onclick="S.cm=new Date(${y},${m+1},1);drawOpen()">&gt;</button></div>
    <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-500 mb-1">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x => `<div>${x}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${c}</div></div>`;
}
function bookModal(id) {
  const s = S.slots.find(x => x.id === id); window._s = s;
  modal(`<h3 class="font-bold text-lg mb-2">Book this diamond</h3>
    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm mb-3"><b>${esc(s.park_name)} #${esc(s.diamond_number)}</b> ${tier(s)}<br>${D(s.date)}, ${T(s.start_time)} - ${T(s.end_time)}</div>
    <p class="text-sm mb-2">Booking for <b>${esc(S.team.name)}</b> (${S.team.tokens_remaining} credits)</p>
    <label class="lbl">Reason</label><select id="b-r" class="inp mb-3" onchange="$('b-c').textContent=calc(window._s,this.value)"><option>Practice</option><option>Exhibition Game</option><option value="Rainout">Rainout</option></select>
    <p class="text-sm mb-4">Cost: <b id="b-c">${calc(s,'Practice')}</b> credit(s). Free cancellation until ${S.set.cancel_hours} hours before start.</p>
    <div class="flex gap-2"><button class="btn2 w-1/2" onclick="closeModal()">Cancel</button><button class="btn w-1/2" onclick="doBook('${id}')">Confirm booking</button></div>`);
}
async function doBook(id) {
  await rpc('book_diamond', { p_diamond_id: id, p_team_id: S.team.id, p_reason: $('b-r').value });
  closeModal(); await loadMem(); header(); await loadSlots(); if (S.tab === 'open') drawOpen();
}

/* ---------- COACH: MY BOOKINGS ---------- */
V.mine = async () => {
  if (!S.team) return $('view').innerHTML = '<div class="card">Join a team to see its bookings.</div>';
  const [{ data: b }, { data: l }] = await Promise.all([
    db.from('diamonds').select('*').eq('booked_by_team_id', S.team.id).order('date'),
    db.from('token_ledger').select('*').eq('team_id', S.team.id).order('created_at', { ascending: false }).limit(40)]);
  S.mine = b || [];
  $('view').innerHTML = `<h2 class="font-bold text-lg mb-2">${esc(S.team.name)}: bookings</h2>
  <div class="card !p-0 overflow-x-auto mb-6"><table class="w-full text-sm"><thead><tr><th class="th">Date</th><th class="th">Where</th><th class="th">Reason</th><th class="th">Cost</th><th class="th">Status</th><th class="th"></th></tr></thead><tbody>
  ${S.mine.length ? S.mine.map(d => `<tr class="border-t border-slate-100"><td class="td">${D(d.date)}<br><span class="text-xs text-slate-500">${T(d.start_time)} - ${T(d.end_time)}</span></td>
    <td class="td">${esc(d.park_name)} #${esc(d.diamond_number)} ${tier(d)}</td><td class="td">${esc(d.booking_reason)}</td><td class="td">${d.token_cost ?? 0}</td><td class="td">${stTag(d.status)}</td>
    <td class="td text-right whitespace-nowrap"><button class="btng" onclick="ics('${d.id}')">Add to calendar</button>
    ${d.status==='Booked'&&d.date>=today()?`<button class="btnr ml-1" onclick="cancelB('${d.id}')">Cancel</button>`:''}</td></tr>`).join('') : '<tr><td colspan="6" class="td text-center text-slate-500 py-6">No bookings yet. Find a slot under Open diamonds.</td></tr>'}</tbody></table></div>
  <h2 class="font-bold text-lg mb-2">Credit history <span class="text-sm font-normal text-slate-500">(balance: ${S.team.tokens_remaining})</span></h2>
  <div class="card !p-0 overflow-x-auto"><table class="w-full text-sm"><tbody>${(l || []).map(r => `<tr class="border-t border-slate-100"><td class="td text-slate-500 whitespace-nowrap">${new Date(r.created_at).toLocaleDateString('en-CA')}</td><td class="td">${esc(r.reason)}</td><td class="td text-right font-bold ${r.delta<0?'text-red-700':'text-emerald-700'}">${r.delta>0?'+':''}${r.delta}</td></tr>`).join('') || '<tr><td class="td text-slate-500">No activity yet.</td></tr>'}</tbody></table></div>`;
};
async function cancelB(id) {
  if (!confirm(`Cancel this booking? Credits are refunded only if you cancel at least ${S.set.cancel_hours} hours before the start time.`)) return;
  await rpc('release_diamond', { p_diamond_id: id, p_mode: 'cancel' }); await loadMem(); header(); V.mine();
}
function ics(id) {
  const d = S.mine.find(x => x.id === id), f = (dt, t) => dt.replace(/-/g,'') + 'T' + t.slice(0,5).replace(':','') + '00';
  dl(['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Diamond Portal//EN','BEGIN:VEVENT',`UID:${d.id}@diamondportal`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,'')}`,`DTSTART:${f(d.date,d.start_time)}`,`DTEND:${f(d.date,d.end_time)}`,

let csvRows = [];
V.imp = async () => {
  $('view').innerHTML = `<div class="card"><div class="flex flex-wrap justify-between gap-3 mb-3"><div><h2 class="font-bold text-lg">Import permits from CSV</h2>
    <p class="text-sm text-slate-600">Columns: <code class="bg-slate-100 px-1 rounded">park_name, diamond_number, date, start_time, end_time, field_size, has_lights</code>. Dates as YYYY-MM-DD, times as HH:MM (24 hour). Duplicates are skipped.</p></div>
    <button class="btn2 self-start" onclick="sampleCSV()">Download sample</button></div>
    <input type="file" accept=".csv" onchange="readCSV(event)" class="text-sm"><div id="csv-out" class="mt-4"></div></div>`;
};
function sampleCSV() {
  dl('park_name,diamond_number,date,start_time,end_time,field_size,has_lights\nMeadowvale Sports Park,1,' + today() + ',18:30,20:30,60ft,true\nLakefront Park,3,' + today() + ',19:00,21:00,70ft,false\n', 'sample_permits.csv', 'text/csv');
}
function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i+1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i+1] === '\n') i++; r.push(c); c = ''; if (r.some(x => x.trim())) rows.push(r); r = []; }
    else c += ch;
  }
  r.push(c); if (r.some(x => x.trim())) rows.push(r); return rows;
}
function readCSV(e) {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(rd.result.replace(/^\uFEFF/, '')); if (rows.length < 2) return toast('That CSV is empty.', 1);
    const h = rows[0].map(x => x.trim().toLowerCase()); csvRows = [];
    rows.slice(1).forEach((c, i) => {
      const o = {}; h.forEach((k, j) => o[k] = (c[j] || '').trim());
      const pad = t => /^\d{1,2}:\d{2}/.test(t) ? t.slice(0,5).padStart(5,'0') : '';
      const r = { park_name: o.park_name, diamond_number: o.diamond_number, date: o.date, start_time: pad(o.start_time), end_time: pad(o.end_time),
        field_size: o.field_size || '60ft', has_lights: ['true','1','yes','y'].includes((o.has_lights || '').toLowerCase()) };
      const bad = [];
      if (!r.park_name) bad.push('park missing'); if (!r.diamond_number) bad.push('diamond missing');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date) || isNaN(new Date(r.date))) bad.push('bad date');
      if (!r.start_time || !r.end_time) bad.push('bad time'); else if (r.end_time <= r.start_time) bad.push('end before start');
      csvRows.push({ n: i + 2, r, bad });
    });
    const ok = csvRows.filter(x => !x.bad.length).length;
    $('csv-out').innerHTML = `<p class="text-sm mb-2"><b>${ok}</b> valid rows, <b class="${csvRows.length-ok?'text-red-700':''}">${csvRows.length-ok}</b> with problems.</p>
      <div class="max-h-72 overflow-auto border border-slate-200 rounded-lg mb-3"><table class="w-full text-xs"><tbody>${csvRows.map(x => `<tr class="border-t border-slate-100 ${x.bad.length?'bg-red-50':''}"><td class="td">Row ${x.n}</td><td class="td">${esc(x.r.park_name)} #${esc(x.r.diamond_number)}</td><td class="td">${esc(x.r.date)} ${esc(x.r.start_time)}-${esc(x.r.end_time)}</td><td class="td">${x.r.has_lights?'lit':'unlit'}</td><td class="td text-red-700">${x.bad.join(', ')}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn" ${ok?'':'disabled'} onclick="doImport()">Import ${ok} valid row(s)</button>`;
  };
  rd.readAsText(f);
}
async function doImport() {
  const rows = csvRows.filter(x => !x.bad.length).map(x => x.r);
  const { data, error } = await db.from('diamonds').upsert(rows, { onConflict: 'park_name,diamond_number,date,start_time', ignoreDuplicates: true }).select('id');
  if (error) return toast(error.message, 1);
  audit('CSV import', `${data.length} added, ${rows.length - data.length} duplicates skipped`);
  toast(`${data.length} slots added. ${rows.length - data.length} duplicates skipped.`); csvRows = []; V.imp();
}

V.aud = async () => {
  const { data } = await db.from('audit_log').select('*').order('created_at', { ascending: false }).limit(150);
  $('view').innerHTML = `<h2 class="font-bold text-lg mb-2">Audit log (latest 150)</h2><div class="card !p-0 overflow-x-auto"><table class="w-full text-sm"><tbody>
  ${(data || []).map(r => `<tr class="border-t border-slate-100"><td class="td whitespace-nowrap text-slate-500">${new Date(r.created_at).toLocaleString('en-CA',{dateStyle:'medium',timeStyle:'short'})}</td><td class="td">${esc(r.actor_email)}</td><td class="td font-semibold">${esc(r.action)}</td><td class="td text-slate-600">${esc(r.details)}</td></tr>`).join('') || '<tr><td class="td text-slate-500">Nothing logged yet.</td></tr>'}</tbody></table></div>`;
};

/* ---------- LIVE UPDATES ---------- */
db.channel('diamonds-live').on('postgres_changes', { event: '*', schema: 'public', table: 'diamonds' }, () => {
  if (S.user && S.tab === 'open' && $('modal').classList.contains('hidden') && !$('app').classList.contains('hidden')) V.open();
}).subscribe();
</script>
