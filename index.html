<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style type="text/tailwindcss">
@layer components{
.btn{@apply px-3 py-1.5 rounded-lg text-sm font-semibold bg-emerald-800 text-white hover:bg-emerald-900 disabled:opacity-50}
.btn2{@apply px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-700 border border-slate-300 hover:bg-slate-100}
.btnr{@apply px-2 py-1 rounded text-xs font-medium bg-red-50 text-red-700 border border-red-200 hover:bg-red-100}
.btng{@apply px-2 py-1 rounded text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100}
.inp{@apply w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white}
.card{@apply bg-white rounded-xl border border-slate-200 p-4}
.lbl{@apply block text-xs font-semibold text-slate-600 mb-1}
.th{@apply px-3 py-2 text-left text-xs font-semibold text-slate-600 bg-slate-100}
.td{@apply px-3 py-2 align-top}
.tag{@apply px-2 py-0.5 rounded text-xs font-semibold inline-block}
}</style>
</head>
<body class="bg-stone-50 text-slate-800 min-h-screen">
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div id="mbody" class="bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5"></div></div>

<!-- SIGN IN / SIGN UP -->
<div id="auth" class="hidden min-h-screen flex items-center justify-center p-4">
  <form onsubmit="authSubmit(event)" class="card w-full max-w-sm space-y-3">
    <h1 class="font-bold text-xl text-emerald-900">Diamond Portal</h1>
    <p class="text-sm text-slate-500">Members only. Sign in to see available diamonds.</p>
    <div id="a-namebox" class="hidden space-y-3"><div><label class="lbl">Your name</label><input id="a-name" class="inp"></div><div><label class="lbl">Phone number</label><input id="a-phone" type="tel" class="inp"></div></div>
    <div><label class="lbl">Email</label><input id="a-email" type="email" required class="inp"></div>
    <div><label class="lbl">Password</label><input id="a-pw" type="password" required minlength="6" class="inp"></div>
    <button id="a-btn" class="btn w-full">Sign in</button>
    <div class="flex justify-between text-xs">
      <button type="button" class="text-emerald-800 underline" onclick="forgot()">Forgot password?</button>
      <button type="button" id="a-toggle" class="text-emerald-800 underline" onclick="authMode()">Create an account</button>
    </div>
  </form>
</div>

<!-- TEAM JOIN (new users before approval) -->
<div id="onboard" class="hidden max-w-lg mx-auto p-4 pt-10"></div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-emerald-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div><div id="ttl" class="font-bold text-lg leading-tight">Diamond Portal</div><div id="who" class="text-xs text-emerald-200"></div></div>
      <div id="hdr" class="flex flex-wrap items-center gap-2"></div>
    </div>
  </header>
  <div class="bg-white border-b border-slate-200"><nav id="tabs" class="max-w-6xl mx-auto px-4 flex overflow-x-auto"></nav></div>
  <div id="banner"></div>
  <main id="view" class="max-w-6xl mx-auto px-4 py-5"></main>
</div>

<script>
const db = window.supabase.createClient('https://srxptffjytjzyobafmkv.supabase.co','sb_publishable_6d3TQR4H_CwT9j1Wg9cMUA_kSkcKYxf');
const newF = () => ({ from: '', to: '', park: '', tier: '', days: [1,2,3,4,5,6,7] });
const S = {user:null,profile:null,mem:[],myTeams:[],team:null,teams:[],set:{},perms:{},rules:[],exc:[],slots:[],mine:[],all:[],tab:'open',f:newF(),mf:{past:false,future:true,diamond:'',status:''},uf:{q:'',team:'',group:''},aid:null,assoc:null,assocs:[],role:'user',au:null,dm:[],inv:[],cal:false,cm:new Date(),pend:0,sf:{status:'',park:'',from:''}};
const V = {};
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const D = s => { const [y,m,d] = s.split('-'); return new Date(y,m-1,d).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'}); };
const T = s => { let [h,m] = s.split(':'); h = +h; return `${h%12||12}:${m} ${h>=12?'PM':'AM'}`; };
const isAdmin = () => S.role === 'admin' || !!S.profile?.is_developer;
const can = k => isAdmin() || !!S.perms[k];
const dl = (txt,name,type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type})); a.download = name; a.click(); };
const modal = h => { $('mbody').innerHTML = h; $('modal').classList.remove('hidden'); };
const closeModal = () => $('modal').classList.add('hidden');
const audit = (a,d) => db.rpc('log_audit',{p_action:a,p_details:d||''});
const TIERS = ['Practice','Standard','Premium','Lit'];
const TC = {Practice:'bg-slate-100 text-slate-700',Standard:'bg-emerald-100 text-emerald-800',Premium:'bg-amber-100 text-amber-900',Lit:'bg-violet-100 text-violet-800'};
const tier = s => `<span class="tag ${TC[s.tier]}">${s.tier}</span>`;
const cost = s => +S.set['cost_' + s.tier.toLowerCase()];
const calc = (s,r) => r === 'Rescheduled Game' && S.set.rainout_free === 'true' ? 0 : cost(s);
const stTag = s => `<span class="tag ${s==='Booked'?'bg-blue-100 text-blue-800':s==='Rainout'?'bg-red-100 text-red-800':'bg-emerald-100 text-emerald-800'}">${s}</span>`;
const row = c => `<tr class="border-t border-slate-100">${c}</tr>`;
const tbl = (h, rows, empty) => `<div class="card !p-0 overflow-x-auto"><table class="w-full text-sm"><thead><tr>${h.map(x => `<th class="th">${x}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.join('') : `<tr><td colspan="${h.length}" class="td text-center text-slate-500 py-6">${empty}</td></tr>`}</tbody></table></div>`;
const fld = (l, h) => `<div><label class="lbl">${l}</label>${h}</div>`;
const tierSel = (id, v) => `<select id="${id}" class="inp">${TIERS.map(t => `<option ${t===v?'selected':''}>${t}</option>`).join('')}</select>`;
const addrOf = m => m ? [m.address, m.city, [m.province, m.postal_code].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '';
const dmOf = s => S.dm.find(m => m.park_name === s.park_name && m.diamond_number === s.diamond_number);
const mapLink = s => `<a class="text-xs text-emerald-800 underline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addrOf(dmOf(s)) || s.park_name)}">map</a>`;
const addrLine = s => { const a = addrOf(dmOf(s)); return a ? `<div class="text-xs text-slate-500">${esc(a)}</div>` : ''; };
function canUse(t, s) {
  if (!t) return true;
  const ex = f => S.exc.find(x => x.park_name === s.park_name && x.diamond_number === s.diamond_number && f(x));
  let e = ex(x => x.team_id === t.id); if (!e && t.division) e = ex(x => !x.team_id && x.division === t.division);
  if (e) return e.allow;
  if (!t.division) return true;
  const r = S.rules.find(x => x.division === t.division && x.tier === s.tier); if (!r) return true;
  return s.start_time.slice(0, 5) >= (S.set.late_start || '20:30').slice(0, 5) ? r.allowed_late : r.allowed;
}
function toast(m, err) {
  const t = $('toast');
  t.className = `fixed top-3 right-3 z-[60] max-w-sm p-3 rounded-lg border text-sm shadow ${err?'bg-red-50 border-red-300 text-red-800':'bg-emerald-50 border-emerald-300 text-emerald-900'}`;
  t.textContent = m; clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 5000);
}
async function rpc(fn, args) {
  const { data, error } = await db.rpc(fn, args);
  if (error) { toast(error.message, 1); return null; }
  if (data && data.success === false) { toast(data.message, 1); return null; }
  if (data && data.message) toast(data.message);
  return data || {};
}
function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i+1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i+1] === '\n') i++; r.push(c); c = ''; if (r.some(x => x.trim())) rows.push(r); r = []; }
    else c += ch;
  }
  r.push(c); if (r.some(x => x.trim())) rows.push(r); return rows;
}
function readObjs(file, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(rd.result.replace(/^\uFEFF/, '')); if (rows.length < 2) return toast('That CSV is empty.', 1);
    const h = rows[0].map(x => x.trim().toLowerCase());
    cb(rows.slice(1).map(c => Object.fromEntries(h.map((k, j) => [k, (c[j] || '').trim()]))));
  };
  rd.readAsText(file);
}
const csvQ = v => `"${String(v ?? '').replace(/"/g,'""')}"`;

/* ---------- AUTH ---------- */
let signup = false;
function authMode() {
  signup = !signup;
  $('a-namebox').classList.toggle('hidden', !signup); $('a-name').required = signup;
  $('a-btn').textContent = signup ? 'Create account' : 'Sign in';
  $('a-toggle').textContent = signup ? 'I already have an account' : 'Create an account';
}
async function authSubmit(e) {
  e.preventDefault();
  const email = $('a-email').value.trim(), password = $('a-pw').value;
  if (signup) {
    const { error } = await db.auth.signUp({ email, password, options: { data: { full_name: $('a-name').value.trim(), phone: $('a-phone').value.trim() }, emailRedirectTo: location.origin + location.pathname } });
    if (error) return toast(error.message, 1);
    toast('Account created. Confirm your email, then sign in and choose your team.'); authMode();
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) toast(error.message, 1);
  }
}
async function forgot() {
  const email = $('a-email').value.trim();
  if (!email) return toast('Enter your email first.', 1);
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  error ? toast(error.message, 1) : toast('Password reset email sent.');
}
db.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(async () => {
    const p = prompt('Enter a new password (6+ characters):');
    if (p) { const r = await db.auth.updateUser({ password: p }); toast(r.error ? r.error.message : 'Password updated.', !!r.error); }
  }, 300);
  if (ev === 'SIGNED_IN' && S.user && session && S.user.id === session.user.id) return;
  if (['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)) setTimeout(() => boot(session), 0);
});

/* ---------- BOOT ---------- */
async function boot(session) {
  S.user = session?.user || null;
  ['auth','onboard','app'].forEach(x => $(x).classList.add('hidden'));
  if (!S.user) { S.profile = null; return $('auth').classList.remove('hidden'); }
  const { data: p } = await db.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  if (!p) { toast('Profile not found. Contact an administrator.', 1); return db.auth.signOut(); }
  S.profile = p;
  const { data: as } = await db.from('associations').select('*').order('name');
  S.assocs = as || [];
  if (!S.assocs.length) {
    if (!p.is_developer) return showJoinAssoc();
    Object.assign(S, { aid: null, assoc: null, role: 'admin', perms: {}, team: null, myTeams: [], mem: [], set: {}, au: null, tab: 'plat' });
    return showApp();
  }
  if (!S.assocs.find(a => a.id === p.active_assoc_id)) { await db.rpc('set_active_assoc', { p_assoc: S.assocs[0].id }); p.active_assoc_id = S.assocs[0].id; }
  S.aid = p.active_assoc_id; S.assoc = S.assocs.find(a => a.id === S.aid);
  const { data: au } = await db.from('assoc_users').select('*').eq('user_id', S.user.id).eq('association_id', S.aid).maybeSingle();
  S.au = au; S.role = p.is_developer ? 'admin' : (au?.role || 'user');
  await Promise.all([loadMem(), loadSet(), loadTeams(), loadPerms(), loadRules()]);
  if (can('approve_members')) await pending();
  if (S.role === 'user' && !S.team) return showOnboard();
  if (S.tab === 'open' && can('view_dashboard')) S.tab = 'dash';
  if (!TABS.some(t => t[0] === S.tab && showTab(t))) S.tab = 'open';
  showApp();
}
function showJoinAssoc() {
  const o = $('onboard'); o.classList.remove('hidden');
  o.innerHTML = `<div class="card space-y-4"><div class="flex justify-between items-center"><h1 class="font-bold text-xl text-emerald-900">Join your association</h1><button class="btn2" onclick="db.auth.signOut()">Sign out</button></div>
    <p class="text-sm text-slate-600">Signed in as ${esc(S.user.email)}. Enter the join code your association gave you.</p>
    ${fld('Join code', `<input id="j-code" class="inp uppercase" value="${esc(new URLSearchParams(location.search).get('a') || '')}">`)}<button class="btn" onclick="joinAssoc()">Continue</button></div>`;
}
async function joinAssoc() {
  if (await rpc('join_association', { p_code: $('j-code').value })) { const { data } = await db.auth.getSession(); boot(data.session); }
}
async function loadMem() {
  const { data } = await db.from('team_members').select('*,teams(id,name,division,tokens_remaining)').eq('user_id', S.user.id);
  S.mem = data || [];
  S.myTeams = S.mem.filter(m => m.status === 'approved').map(m => m.teams);
  S.team = S.myTeams.find(t => t.id === S.au?.active_team_id) || S.myTeams[0] || null;
}
async function loadSet() { const { data } = await db.from('settings').select('*'); S.set = Object.fromEntries((data || []).map(r => [r.key, r.value])); }
async function loadTeams() { const { data } = await db.from('teams').select('*').order('name'); S.teams = data || []; }
async function loadPerms() {
  const { data } = await db.from('permissions').select('*').eq('role', S.role);
  S.perms = Object.fromEntries((data || []).filter(x => x.allowed).map(x => [x.perm, 1]));
}
async function loadRules() {
  const [a, b] = await Promise.all([db.from('tier_rules').select('*'), db.from('diamond_exceptions').select('*')]);
  S.rules = a.data || []; S.exc = b.data || [];
}
async function loadMaster() {
  const { data } = await db.from('diamond_master').select('*');
  S.dm = (data || []).sort((a, b) => (a.park_name + ' ' + a.diamond_number).localeCompare(b.park_name + ' ' + b.diamond_number, undefined, { numeric: true }));
}
async function pending() {
  const { count } = await db.from('team_members').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  S.pend = count || 0;
}

/* ---------- TEAM JOIN ---------- */
function joinForm() {
  const taken = new Set(S.mem.filter(m => m.status !== 'rejected').map(m => m.team_id));
  const av = S.teams.filter(t => t.active && !taken.has(t.id));
  return av.length ? `<div><label class="lbl">Request to join a team</label><div class="flex gap-2">
    <select id="j-team" class="inp">${av.map(t => `<option value="${t.id}">${esc(t.name)}${t.division?' ('+esc(t.division)+')':''}</option>`).join('')}</select>
    <button class="btn" onclick="reqTeam()">Request</button></div>
    <p class="text-xs text-slate-500 mt-1">An administrator must approve each request. You can belong to more than one team.</p></div>`
    : '<p class="text-sm text-slate-500">No teams available to join. Ask your administrator to create teams.</p>';
}
function memList() {
  if (!S.mem.length) return '';
  return `<div><div class="lbl">Your requests</div>${S.mem.map(m => `<div class="flex justify-between text-sm py-1 border-b border-slate-100"><span>${esc(m.teams?.name)}</span>
    <span class="tag ${m.status==='approved'?'bg-emerald-100 text-emerald-800':m.status==='pending'?'bg-amber-100 text-amber-800':'bg-red-100 text-red-800'}">${m.status}</span></div>`).join('')}</div>`;
}
function showOnboard() {
  const o = $('onboard'); o.classList.remove('hidden');
  o.innerHTML = `<div class="card space-y-4"><div class="flex justify-between items-center"><h1 class="font-bold text-xl text-emerald-900">Choose your team</h1><button class="btn2" onclick="db.auth.signOut()">Sign out</button></div>
    <p class="text-sm text-slate-600">Signed in as ${esc(S.user.email)}. You can see diamonds once an administrator approves your team.</p>${joinForm()}${memList()}</div>`;
}
async function reqTeam() {
  const id = $('j-team')?.value; if (!id) return;
  if (await rpc('request_team', { p_team_id: id })) { await loadMem(); closeModal(); (S.role === 'user' && !S.team) ? showOnboard() : (showApp(), joinModal()); }
}
function joinModal() { modal(`<div class="space-y-4"><div class="flex justify-between"><h3 class="font-bold text-lg">Join another team</h3><button class="btn2" onclick="closeModal()">Close</button></div>${joinForm()}${memList()}</div>`); }

/* ---------- APP SHELL ---------- */
// Everyday tabs on the left; one-time / seasonal setup tabs (flag 1) on the right.
const TABS = [['open','Open diamonds'],['mine','My bookings'],['dash','Dashboard','view_dashboard'],['sched','Schedule','view_schedule'],['appr','Approvals','approve_members'],['cred','Credits','add_credits'],['slots','Add slots','add_slots'],['users','Users','manage_users'],
  ['teams','Teams','manage_teams',1],['dm','Diamond Master','manage_diamonds',1],['dia','Age & Time Restrictions','manage_rules',1],['set','Settings','manage_rules',1],['acc','Access control','ADMIN',1],['aud','Audit log','view_audit',1],['plat','Platform','DEV',1]];
const showTab = t => t[2] === 'DEV' ? !!S.profile?.is_developer : (!!S.aid && (!t[2] || (t[2] === 'ADMIN' ? isAdmin() : can(t[2]))));
function showApp() {
  ['auth','onboard'].forEach(x => $(x).classList.add('hidden')); $('app').classList.remove('hidden');
  header(); tabs(); banner(); go(S.tab);
}
function header() {
  $('ttl').textContent = S.assoc?.name || 'Diamond Portal';
  $('who').textContent = `${S.profile.full_name || S.profile.email} (${S.profile.is_developer ? 'developer' : S.role})`;
  const asel = S.assocs.length > 1 ? `<select class="rounded-lg px-2 py-1 text-sm text-slate-900" onchange="switchAssoc(this.value)">${S.assocs.map(a => `<option value="${a.id}" ${a.id===S.aid?'selected':''}>${esc(a.name)}</option>`).join('')}</select>` : '';
  const sel = S.myTeams.length ? `<select class="rounded-lg px-2 py-1 text-sm text-slate-900" onchange="switchTeam(this.value)">${S.myTeams.map(t => `<option value="${t.id}" ${t.id===S.team?.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <span class="tag bg-amber-300 text-slate-900">${S.team?.tokens_remaining ?? 0} credits</span>` : '';
  $('hdr').innerHTML = `${asel}${sel}${S.aid ? '<button class="btn2 !py-1" onclick="joinModal()">Join a team</button>' : ''}<button class="btn2 !py-1" onclick="profileModal()">My profile</button><button class="btn2 !py-1" onclick="db.auth.signOut()">Sign out</button>`;
}
function tabs() {
  let sep = false;
  $('tabs').innerHTML = TABS.filter(showTab).map(t => {
    const b = t[3] && !sep ? (sep = true, ' ml-3 border-l border-slate-300 pl-3') : '';
    return `<button onclick="go('${t[0]}')" class="px-3 py-3 text-sm font-semibold whitespace-nowrap border-b-2 ${b} ${S.tab===t[0]?'border-emerald-800 text-emerald-900':'border-transparent text-slate-600'}">${t[1]}${t[0]==='appr'&&S.pend?` <span class="tag bg-amber-400 text-slate-900">${S.pend}</span>`:''}</button>`;
  }).join('');
}
function banner() { $('banner').innerHTML = S.set.announcement ? `<div class="bg-amber-100 text-amber-900 text-sm text-center py-2 px-4">${esc(S.set.announcement)}</div>` : ''; }
async function go(t) { S.tab = t; tabs(); $('view').innerHTML = '<p class="text-slate-500 p-6">Loading...</p>'; await V[t](); }
async function switchTeam(id) {
  if (await rpc('set_active_team', { p_team_id: id })) { if (S.au) S.au.active_team_id = id; await loadMem(); header(); go(S.tab); }
}
async function switchAssoc(id) {
  if (await rpc('set_active_assoc', { p_assoc: id })) { S.tab = 'open'; const { data } = await db.auth.getSession(); boot(data.session); }
}

/* ---------- OPEN DIAMONDS (rows) ---------- */
async function loadSlots() {
  const { data, error } = await db.from('diamonds').select('*').eq('status','Available').gte('date', today())
    .order('date').order('start_time').order('park_name').order('diamond_number');
  if (error) return toast(error.message, 1);
  S.slots = data || [];
}
V.open = async () => { await Promise.all([loadSlots(), loadRules(), loadSet(), loadMaster(), loadTeams()]); drawOpen(); };
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const isoDow = s => { const [y, m, d] = s.split('-'); const g = new Date(y, m - 1, d).getDay(); return g === 0 ? 7 : g; };
function openFiltered() {
  const f = S.f;
  return S.slots.filter(s => (!f.park || s.park_name === f.park) && (!f.tier || s.tier === f.tier) && (!f.from || s.date >= f.from) && (!f.to || s.date <= f.to) && f.days.includes(isoDow(s.date)));
}
function toggleDay(n, on) { S.f.days = on ? [...new Set([...S.f.days, n])] : S.f.days.filter(x => x !== n); drawOpen(); }
function drawOpen() {
  const f = S.f, parks = [...new Set(S.slots.map(s => s.park_name))].sort(), list = openFiltered();
  const act = s => !S.team ? '<span class="text-xs text-amber-700">Join a team</span>'

async function genSlots() {

function sampleCSV() {

function readSlotCSV(e) {
  const f = e.target.files[0]; if (!f) return;
  readObjs(f, objs => {
    csvRows = objs.map((o, i) => {
      const pad = t => /^\d{1,2}:\d{2}/.test(t) ? t.slice(0,5).padStart(5,'0') : '';
      const m = S.dm.find(x => x.park_name.toLowerCase() === (o.park_name || '').toLowerCase() && x.diamond_number.toLowerCase() === (o.diamond_number || '').toLowerCase());
      const tr = o.tier ? TIERS.find(t => t.toLowerCase() === o.tier.toLowerCase()) : m?.tier;
      const r = { association_id: S.aid, park_name: m?.park_name || o.park_name, diamond_number: m?.diamond_number || o.diamond_number, date: o.date, start_time: pad(o.start_time), end_time: pad(o.end_time), tier: tr }, bad = [];
      if (!m) bad.push('diamond not in Diamond Master'); if (o.tier && !tr) bad.push('bad level');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date) || isNaN(new Date(r.date))) bad.push('bad date');
      if (!r.start_time || !r.end_time) bad.push('bad time'); else if (r.end_time <= r.start_time) bad.push('end before start');
      return { n: i + 2, r, bad };
    });
    const ok = csvRows.filter(x => !x.bad.length).length;
    $('csv-out').innerHTML = `<p class="text-sm mb-2"><b>${ok}</b> valid rows, <b class="${csvRows.length-ok?'text-red-700':''}">${csvRows.length-ok}</b> with problems.</p>
      <div class="max-h-72 overflow-auto border border-slate-200 rounded-lg mb-3"><table class="w-full text-xs"><tbody>${csvRows.map(x => row(`<td class="td">Row ${x.n}</td><td class="td">${esc(x.r.park_name)} #${esc(x.r.diamond_number)}</td><td class="td">${esc(x.r.date)} ${esc(x.r.start_time)}-${esc(x.r.end_time)}</td><td class="td">${esc(x.r.tier || '')}</td><td class="td text-red-700">${x.bad.join(', ')}</td>`)).join('')}</tbody></table></div>
      <button class="btn" ${ok?'':'disabled'} onclick="doImport()">Import ${ok} valid row(s)</button>`;
  });
}
async function doImport() {
  const rows = csvRows.filter(x => !x.bad.length).map(x => x.r);
  const { data, error } = await db.from('diamonds').upsert(rows, { onConflict: 'association_id,park_name,diamond_number,date,start_time', ignoreDuplicates: true }).select('id');
  if (error) return toast(error.message, 1);
  audit('CSV import', `${data.length} added, ${rows.length - data.length} duplicates skipped`);
  toast(`${data.length} slots added. ${rows.length - data.length} duplicates skipped.`); csvRows = []; V.slots();
}

function dmCSV() { dl(['park_name,diamond_number,tier,address,city,province,postal_code,active,notes', ...S.dm.map(x => [x.park_name, x.diamond_number, x.tier, x.address, x.city, x.province, x.postal_code, x.active, x.notes].map(csvQ).join(','))].join('\n'), 'diamond_master.csv', 'text/csv'); }
function upDiamonds(e) {
  const f = e.target.files[0]; if (!f) return;
  readObjs(f, async objs => {
    const rows = [], bad = [];
    objs.forEach((o, i) => { const t = TIERS.find(x => x.toLowerCase() === (o.tier || 'standard').toLowerCase());
      if (!o.park_name || !o.diamond_number || !t) return bad.push(i + 2);
      rows.push({ association_id: S.aid, park_name: o.park_name, diamond_number: o.diamond_number, tier: t, address: o.address || null, city: o.city || null, province: o.province || null,
        postal_code: (o.postal_code || '').toUpperCase() || null, active: !['false','0','no'].includes((o.active || 'true').toLowerCase()), notes: o.notes || null }); });
    if (!rows.length) return toast('No valid rows. Each needs park_name, diamond_number and a valid tier.', 1);
    if (!confirm(`Import ${rows.length} diamond(s)? Existing diamonds are updated.${bad.length ? ` Skipping bad rows: ${bad.join(', ')}.` : ''}`)) return;
    const { error } = await db.from('diamond_master').upsert(rows, { onConflict: 'association_id,park_name,diamond_number' });
    if (error) return toast(error.message, 1);
    await rpc('sync_tiers', {}); audit('Diamond CSV import', rows.length + ' rows'); V.dm();
  });
}

/* ---------- EVENT FIELDS AND PROFILE ---------- */
const EVENTS = ['Practice', 'Game', 'Exhibition Game', 'Rescheduled Game', 'Clinic', 'Tryout'];
const isGameEv = r => ['Game', 'Exhibition Game', 'Rescheduled Game'].includes(r);
const needsOpp = r => r === 'Game' || r === 'Exhibition Game';
const evText = d => `${esc(d.booking_reason)}${d.game_number ? ` #${esc(d.game_number)}` : ''}${d.opponent_name ? `<div class="text-xs text-slate-500">vs ${esc(d.opponent_name)}</div>` : ''}`;
// Event type + (for games) optional game number + opponent chosen from teams or typed in under OTHER
function evFields(p, cur = {}, excl) {
  const r = cur.reason || 'Practice', teams = S.teams.filter(t => t.active && t.id !== excl), isOther = !!cur.oppName && !cur.oppTeam;
  return `${fld('Event type', `<select id="${p}-r" class="inp" onchange="evChange('${p}')">${EVENTS.map(e => `<option ${e===r?'selected':''}>${e}</option>`).join('')}</select>`)}
    <div id="${p}-gb" class="space-y-3 mt-3 ${isGameEv(r) ? '' : 'hidden'}">${fld('Game # (optional)', `<input id="${p}-g" class="inp" value="${esc(cur.game || '')}">`)}
    ${fld('Opponent', `<select id="${p}-o" class="inp" onchange="evChange('${p}')"><option value="">Select opponent...</option>${teams.map(t => `<option value="${t.id}" ${t.id===cur.oppTeam?'selected':''}>${esc(t.name)}${t.division ? ' (' + esc(t.division) + ')' : ''}</option>`).join('')}<option value="other" ${isOther?'selected':''}>OTHER (type it in)</option></select>`)}
    <input id="${p}-ox" class="inp ${isOther ? '' : 'hidden'}" placeholder="Opponent name" value="${isOther ? esc(cur.oppName) : ''}"></div>`;
}
function evChange(p) {
  const r = $(p + '-r').value;
  $(p + '-gb').classList.toggle('hidden', !isGameEv(r));
  $(p + '-ox').classList.toggle('hidden', $(p + '-o').value !== 'other');
  const c = $(p + '-c'); if (c && window._s) c.textContent = calc(window._s, r);
}
function evRead(p) {
  const r = $(p + '-r').value; if (!isGameEv(r)) return { r, g: null, n: null, t: null };
  const g = $(p + '-g').value.trim() || null, v = $(p + '-o').value; let n = null, t = null;
  if (v === 'other') n = $(p + '-ox').value.trim() || null; else if (v) { t = v; n = S.teams.find(x => x.id === v)?.name || null; }
  if (!n && needsOpp(r)) { toast('Select the opponent, or choose OTHER and type it in.', 1); return null; }
  return { r, g, n, t };
}
function profileModal() {
  modal(`<h3 class="font-bold text-lg mb-1">My profile</h3><p class="text-xs text-slate-500 mb-3">${esc(S.profile.email)}</p><div class="space-y-3">
    ${fld('Name', `<input id="pf-name" class="inp" value="${esc(S.profile.full_name || '')}">`)}${fld('Phone number', `<input id="pf-phone" type="tel" class="inp" value="${esc(S.profile.phone || '')}">`)}</div>
    <div class="flex gap-2 mt-4"><button class="btn2 w-1/2" onclick="closeModal()">Cancel</button><button class="btn w-1/2" onclick="saveProfile()">Save</button></div>`);
}
async function saveProfile() {

    S.profile.full_name = $('pf-name').value.trim() || null; S.profile.phone = $('pf-phone').value.trim() || null; closeModal(); header();
